name: Build

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bun_target: bun-darwin-arm64
            sidecar: proxy-server-aarch64-apple-darwin
            bundles: "--bundles dmg"
            artifacts: "**/*.dmg"
          - platform: macos-latest
            target: x86_64-apple-darwin
            bun_target: bun-darwin-x64
            sidecar: proxy-server-x86_64-apple-darwin
            bundles: "--bundles dmg"
            artifacts: "**/*.dmg"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bun_target: bun-windows-x64
            sidecar: proxy-server-x86_64-pc-windows-msvc.exe
            bundles: "--bundles msi nsis"
            artifacts: |
              nsis/AIGateway_*.exe
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bun_target: bun-linux-x64
            sidecar: proxy-server-x86_64-unknown-linux-gnu
            bundles: "--bundles deb rpm"
            artifacts: |
              **/*.deb
              **/*.rpm

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev file libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build sidecar
        run: |
          mkdir -p src-tauri/binaries
          cd proxy && bun install && bun build --compile --target=${{ matrix.bun_target }} proxy-server.js --outfile ../src-tauri/binaries/${{ matrix.sidecar }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Inject version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i.bak "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json && rm -f src-tauri/tauri.conf.json.bak
          echo "Injected version: $VERSION"

      - name: Build
        run: npm run tauri build -- --target ${{ matrix.target }} ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aigateway-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史与 tags 用于生成基于 git log 的中文更新日志
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f

      - name: Generate Chinese changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          # 按版本降序取上一个 v* tag 作为变更范围起点
          PREV_TAG="$(git tag --list 'v*' --sort=-version:refname | awk 'NR==2{print; exit}')"
          RANGE="${PREV_TAG:+$PREV_TAG..}HEAD"
          TYPE_RE='^([a-z]+)(\([^)]*\))?:[[:space:]]*(.*)$'

          {
            echo "## AIGateway v${VERSION} 更新日志"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "**版本范围**：[\`$PREV_TAG\` → \`v$VERSION\`](https://github.com/${GITHUB_REPOSITORY}/compare/$PREV_TAG...v$VERSION)"
            else
              echo "**初始版本发布**"
            fi
            echo

            new=()
            fix=()
            docs=()
            refactor=()
            perf=()
            ui=()
            other=()
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if [[ "$line" =~ $TYPE_RE ]]; then
                t="${BASH_REMATCH[1]}"
                desc="${BASH_REMATCH[3]}"
                [ -z "$desc" ] && desc="$line"
              else
                t="other"
                desc="$line"
              fi
              case "$t" in
                feat)        new+=("$desc") ;;
                fix)         fix+=("$desc") ;;
                docs)        docs+=("$desc") ;;
                refactor)    refactor+=("$desc") ;;
                perf)        perf+=("$desc") ;;
                ui)          ui+=("$desc") ;;
                chore|build|ci|test|style|revert) other+=("$desc") ;;
                *)           other+=("$desc") ;;
              esac
            done <<< "$(git log --pretty=format:'%s' $RANGE)"

            section() {
              local title="$1"; shift
              local items=("$@")
              if [ "${#items[@]}" -gt 0 ]; then
                echo "### $title"
                for it in "${items[@]}"; do
                  echo "- $it"
                done
                echo
              fi
            }

            section "✨ 新增" ${new[@]+"${new[@]}"}
            section "🐛 修复" ${fix[@]+"${fix[@]}"}
            section "📝 文档" ${docs[@]+"${docs[@]}"}
            section "♻️ 重构" ${refactor[@]+"${refactor[@]}"}
            section "⚡ 性能优化" ${perf[@]+"${perf[@]}"}
            section "🎨 界面优化" ${ui[@]+"${ui[@]}"}
            section "🔧 其他变更" ${other[@]+"${other[@]}"}
          } > release_body.md

          echo "===== release_body.md ====="
          cat release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: release_body.md
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*-setup.exe
            artifacts/**/*.deb
            artifacts/**/*.rpm

  open-pr:
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find release branch
        id: release_branch
        run: |
          BRANCH=""
          for b in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin --sort=-committerdate | grep -v '^origin/HEAD$'); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$b" 2>/dev/null; then
              BRANCH="${b#origin/}"
              break
            fi
          done
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create or update PR to main
        if: steps.release_branch.outputs.branch != '' && steps.release_branch.outputs.branch != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.release_branch.outputs.branch }}"
          TITLE="release: v${GITHUB_REF_NAME#v} 合并回 main"
          BODY="由发布构建自动创建：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          PR_NUM="$(gh pr list --base main --head "$BRANCH" --json number --jq '.[0].number')"
          if [ -n "$PR_NUM" ]; then
            echo "已存在 PR #${PR_NUM}，更新标题与描述"
            gh pr edit "$PR_NUM" --title "$TITLE" --body "$BODY"
          else
            echo "创建 PR：$BRANCH -> main"
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" || echo "创建失败：可能分支间没有差异"
          fi
