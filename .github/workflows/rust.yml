name: Build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bun_target: bun-darwin-arm64
            sidecar: proxy-server-aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            bun_target: bun-darwin-x64
            sidecar: proxy-server-x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bun_target: bun-windows-x64
            sidecar: proxy-server-x86_64-pc-windows-msvc.exe
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bun_target: bun-linux-x64
            sidecar: proxy-server-x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev file libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build sidecar
        run: |
          mkdir -p src-tauri/binaries
          cd proxy && bun build --compile --target=${{ matrix.bun_target }} proxy-server.js --outfile ../src-tauri/binaries/${{ matrix.sidecar }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Debug linuxdeploy (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          echo "=== Testing linuxdeploy manually ==="
          mkdir -p /tmp/linuxdeploy-test && cd /tmp/linuxdeploy-test
          curl -fsSL -o linuxdeploy https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          echo "=== linuxdeploy --version ==="
          ./linuxdeploy --version 2>&1 || echo "EXIT CODE: $?"
          echo "=== ldd linuxdeploy ==="
          ldd linuxdeploy 2>&1 || true
          echo "=== FUSE check ==="
          fusermount --version 2>&1 || true
          ls -la /dev/fuse 2>&1 || true

      - name: Build
        run: npm run tauri build -- --target ${{ matrix.target }} --verbose 2>&1 || { echo "=== Build failed, dumping linuxdeploy debug info ==="; ls -la ~/.cache/tauri/ 2>/dev/null || true; ls -la /tmp/linuxdeploy* 2>/dev/null || true; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aigateway-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
